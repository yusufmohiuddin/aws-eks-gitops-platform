name: application-delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "application/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform-reference-service
  IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_attempt }}

jobs:
  publish:
    name: Verify and publish immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-ecr-${{ github.run_id }}

      - name: Authenticate to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Build image for security verification
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: >-
          docker build
          --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          application

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Publish image with provenance and SBOM attestations
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: application
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image identity
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "\`${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Update approved deployment candidate
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          ./scripts/update-image-digest.py
          --file platform/gitops/environments/dev/platform-reference-service/values.yaml
          --repository "${ECR_REGISTRY}/${ECR_REPOSITORY}"
          --digest "${IMAGE_DIGEST}"
          --git-sha "${GITHUB_SHA}"

      - name: Create short-lived GitHub App token
        id: delivery-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}

      - name: Propose digest promotion pull request
        id: promotion
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.delivery-app.outputs.token }}
          add-paths: |
            platform/gitops/environments/dev/platform-reference-service/values.yaml
          branch: delivery/promote-platform-reference-service
          delete-branch: true
          commit-message: "chore: promote platform reference service"
          title: "chore: promote platform reference service"
          body: |
            Promotes the verified application artifact by immutable digest.

            - Source commit: `${{ github.sha }}`
            - Image: `${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.publish.outputs.digest }}`
            - Evidence: tests, vulnerability scan, SPDX SBOM, and provenance attestation completed in run `${{ github.run_id }}`

            Argo CD will reconcile this change only after review and merge.

      - name: Record promotion result
        env:
          PULL_REQUEST_URL: ${{ steps.promotion.outputs.pull-request-url }}
        run: |
          {
            echo
            echo "## Promotion"
            echo
            if [[ -n "${PULL_REQUEST_URL}" ]]; then
              echo "Proposed reviewed deployment state: ${PULL_REQUEST_URL}"
            else
              echo "The approved deployment state already references this digest."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
