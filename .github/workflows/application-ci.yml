name: application-ci

on:
  pull_request:
    paths:
      - "application/**"
      - ".github/workflows/application-ci.yml"
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: application/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint application
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy src

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=platform_reference_service
          --cov-report=term-missing
          --cov-fail-under=90

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --tag platform-reference-service:ci application
