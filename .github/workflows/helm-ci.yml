name: helm-ci

on:
  pull_request:
    paths:
      - "platform/helm/**"
      - "scripts/helm-render-check.sh"
      - ".github/workflows/helm-ci.yml"
  push:
    branches:
      - main
    paths:
      - "platform/helm/**"
      - "scripts/helm-render-check.sh"
      - ".github/workflows/helm-ci.yml"

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Helm quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.2

      - name: Validate chart behavior
        run: ./scripts/helm-render-check.sh
