name: terraform-ci

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize without remote backend
        run: terraform -chdir=infrastructure/bootstrap init -backend=false

      - name: Validate bootstrap configuration
        run: terraform -chdir=infrastructure/bootstrap validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
