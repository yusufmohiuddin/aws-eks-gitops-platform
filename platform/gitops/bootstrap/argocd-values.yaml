global:
  domain: argocd.local

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: "true"
    application.resourceTrackingMethod: annotation

server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
