{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-reference-service.fullname" . }}
  labels:
    {{- include "platform-reference-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-reference-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ingressPort }}
  egress: []
{{- end }}
